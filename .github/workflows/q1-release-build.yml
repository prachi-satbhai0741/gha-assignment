name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string
        default: "1.0.0"

      release_type:
        description: "Release Type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow inputs configured successfully"
