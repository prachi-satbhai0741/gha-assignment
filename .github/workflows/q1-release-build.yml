name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string
        default: "1.0.0"

      release_type:
        description: "Release Type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow inputs configured successfully"
      
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.build_info.outputs.build_tag }}
      build_date: ${{ steps.build_info.outputs.build_date }}

    steps:
      - name: Create build information
        id: build_info
        run: |
          echo "build_tag=v${{ inputs.version }}-${{ inputs.release_type }}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
  announce:
    runs-on: ubuntu-latest

    needs: prepare

    steps:
      - name: Print build information
        run: |
          echo "Version: ${{ inputs.version }}"
          echo "Release Type: ${{ inputs.release_type }}"
          echo "Build Tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build Date: ${{ needs.prepare.outputs.build_date }}"

      - name: Create run summary
        run: |
        
          echo "## Release Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ inputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Type | ${{ inputs.release_type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Tag | ${{ needs.prepare.outputs.build_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Date | ${{ needs.prepare.outputs.build_date }} |" >> "$GITHUB_STEP_SUMMARY"
